services:
  onlyoffice-ds:
    container_name: onlyoffice-ds
    image: onlyoffice/documentserver:latest
    restart: always
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      - LANG=C.UTF-8
      - LANGUAGE=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ../fonts:/usr/share/fonts/truetype/custom
      - ../dictionaries/he_IL:/var/www/onlyoffice/documentserver/server/FileConverter/bin/spellchecker/dictionaries/he_IL:ro
      - ./run.sh:/run_custom.sh
      - /srv/logs/onlyoffice:/var/log/onlyoffice
    ports:
      - "8081:80"
    entrypoint: "/run_custom.sh"
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true